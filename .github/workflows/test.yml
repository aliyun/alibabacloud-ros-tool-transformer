name: Run Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend-coverage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Test frontend with coverage
        run: npm run coverage
        working-directory: frontend
      - name: Save frontend coverage report
        if: ${{ !cancelled() && hashFiles('frontend/coverage/cobertura-coverage.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/cobertura-coverage.xml
          if-no-files-found: error
      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: aliyun/alibabacloud-ros-tool-transformer
          files: frontend/coverage/cobertura-coverage.xml
          flags: frontend
          disable_search: true
          fail_ci_if_error: true
  test:
    strategy:
      matrix:
        os: [ ubuntu-22.04 ]
        python-version: [ '3.9', '3.10', '3.11', '3.12', '3.13', '3.14' ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}
      - name: Run tests
        if: matrix.python-version != '3.12'
        run: uv run --no-sync pytest tests
      - name: Run tests with branch coverage
        if: matrix.python-version == '3.12'
        run: uv run --no-sync coverage run -m pytest tests
      - name: Generate Python coverage reports
        if: matrix.python-version == '3.12'
        run: |
          uv run --no-sync coverage json -o coverage.json
          uv run --no-sync coverage xml -o coverage.xml
          uv run --no-sync coverage report -m
      - name: Save Python coverage report
        if: ${{ !cancelled() && matrix.python-version == '3.12' && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python
          path: coverage.xml
          if-no-files-found: error
      - name: Upload Python coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: aliyun/alibabacloud-ros-tool-transformer
          files: coverage.xml
          flags: python
          disable_search: true
          fail_ci_if_error: true
