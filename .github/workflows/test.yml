name: Run Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend-coverage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Test frontend and enforce 95% coverage
        run: npm run coverage
        working-directory: frontend
      - name: Enforce incremental frontend coverage
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base="${PR_BASE:-$PUSH_BASE}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="origin/$DEFAULT_BRANCH"
          fi
          python3 -m tools.check_frontend_coverage frontend/coverage/coverage-final.json --base "$base"
      - name: Save frontend coverage report
        if: ${{ !cancelled() && hashFiles('frontend/coverage/coverage.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ut-coverage-frontend
          path: frontend/coverage/coverage.xml
          if-no-files-found: error
      - name: Upload frontend coverage to Codecov
        if: ${{ !cancelled() && hashFiles('frontend/coverage/coverage.xml') != '' }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: aliyun/alibabacloud-ros-tool-transformer
          files: frontend/coverage/coverage.xml
          flags: frontend
          disable_search: true
          fail_ci_if_error: true
  test:
    strategy:
      matrix:
        os: [ ubuntu-22.04 ]
        python-version: [ '3.9', '3.10', '3.11', '3.12', '3.13', '3.14' ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}
      - name: Run tests
        if: matrix.python-version != '3.12'
        run: uv run --no-sync pytest tests
      - name: Run tests with branch coverage
        if: matrix.python-version == '3.12'
        run: uv run --no-sync coverage run -m pytest tests
      - name: Generate Python coverage reports
        if: matrix.python-version == '3.12'
        run: |
          uv run --no-sync coverage json -o coverage.json
          uv run --no-sync coverage xml -o coverage.xml
          uv run --no-sync coverage report -m
      - name: Enforce 95% Python coverage
        if: matrix.python-version == '3.12'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base="${PR_BASE:-$PUSH_BASE}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="origin/$DEFAULT_BRANCH"
          fi
          uv run --no-sync python tools/check_coverage.py coverage.json --base "$base"
      - name: Save Python coverage report
        if: ${{ !cancelled() && matrix.python-version == '3.12' && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ut-coverage-python
          path: coverage.xml
          if-no-files-found: error
      - name: Upload Python coverage to Codecov
        if: ${{ !cancelled() && matrix.python-version == '3.12' && hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: aliyun/alibabacloud-ros-tool-transformer
          files: coverage.xml
          flags: python
          disable_search: true
          fail_ci_if_error: true
